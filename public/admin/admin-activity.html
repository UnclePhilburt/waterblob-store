<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Activity Log - Water Blob® Admin</title>
    <link rel="stylesheet" href="admin-mobile.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141824;
            --bg-tertiary: #1a1f2e;
            --accent-primary: #8b5cf6;
            --accent-secondary: #6366f1;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.1);
            --card-bg: rgba(26, 31, 46, 0.6);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            background-image:
                radial-gradient(at 20% 20%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filters {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        select, input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .activity-table {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(139, 92, 246, 0.1);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        tr:hover {
            background: rgba(139, 92, 246, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-admin {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .badge-user {
            background: var(--success);
            color: white;
        }

        .action-type {
            font-weight: 600;
            color: var(--accent-primary);
        }

        .timestamp {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .details-toggle {
            cursor: pointer;
            color: var(--accent-primary);
            text-decoration: underline;
        }

        .details-row {
            display: none;
        }

        .details-row.show {
            display: table-row;
        }

        .details-content {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <a href="/admin/hub.html" class="back-link">← Back to Hub</a>
                <h1>🔍 Activity Tracking</h1>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Activities</div>
                <div class="stat-value" id="totalActivities">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Atlas Actions</div>
                <div class="stat-value" id="atlasActions">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Lorie Actions</div>
                <div class="stat-value" id="lorieActions">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Activity</div>
                <div class="stat-value" id="lastActivity" style="font-size: 1rem;">-</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Filter by User</label>
                <select id="userFilter">
                    <option value="">All Users</option>
                    <option value="Atlas">Atlas (Admin)</option>
                    <option value="Lorie">Lorie (User)</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Action Type</label>
                <select id="actionFilter">
                    <option value="">All Actions</option>
                    <option value="PAGE_VIEW">Page View</option>
                    <option value="CLICK">Click</option>
                    <option value="EDIT">Edit</option>
                    <option value="CREATE">Create</option>
                    <option value="DELETE">Delete</option>
                    <option value="LOGIN">Login</option>
                    <option value="LOGOUT">Logout</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="loadActivityLog()">Apply Filters</button>
            <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
        </div>

        <div class="activity-table">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Details</th>
                        <th>IP Address</th>
                    </tr>
                </thead>
                <tbody id="activityTableBody">
                    <tr>
                        <td colspan="5" class="loading">Loading activity log...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="admin-auth.js"></script>
    <script>
        // API_BASE is defined in admin-auth.js
        // Check if user is admin (only admins can access this page)
        (async function checkAdminAccess() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.role !== 'admin') {
                alert('Access Denied: This page is only accessible to administrators.');
                window.location.href = '/admin/hub.html';
            }
        })();

        async function loadStats() {
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`${API_BASE}/api/activity/stats`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load stats');

                const data = await response.json();

                document.getElementById('totalActivities').textContent = data.totalActivities;

                const atlasStats = data.userStats.find(u => u.username === 'Atlas');
                const lorieStats = data.userStats.find(u => u.username === 'Lorie');

                document.getElementById('atlasActions').textContent = atlasStats?.totalActions || 0;
                document.getElementById('lorieActions').textContent = lorieStats?.totalActions || 0;

                if (data.recentActivity.length > 0) {
                    const lastTime = new Date(data.recentActivity[0].timestamp);
                    document.getElementById('lastActivity').textContent = formatTimeAgo(lastTime);
                }

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadActivityLog() {
            try {
                const token = localStorage.getItem('authToken');
                const userFilter = document.getElementById('userFilter').value;
                const actionFilter = document.getElementById('actionFilter').value;

                let url = '/api/activity?limit=200';
                if (userFilter) url += `&username=${encodeURIComponent(userFilter)}`;

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load activity log');

                const data = await response.json();
                let activities = data.activities;

                // Filter by action type on client side
                if (actionFilter) {
                    activities = activities.filter(a => a.action === actionFilter);
                }

                renderActivityTable(activities);

            } catch (error) {
                console.error('Error loading activity log:', error);
                document.getElementById('activityTableBody').innerHTML = `
                    <tr><td colspan="5" class="no-data">Error loading activity log</td></tr>
                `;
            }
        }

        function renderActivityTable(activities) {
            const tbody = document.getElementById('activityTableBody');

            if (activities.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-data">No activities found</td></tr>';
                return;
            }

            tbody.innerHTML = activities.map(activity => {
                const detailsId = `details-${activity.id}`;
                return `
                    <tr>
                        <td class="timestamp">${formatDateTime(activity.timestamp)}</td>
                        <td>
                            ${activity.username}
                            <span class="badge ${activity.userRole === 'admin' ? 'badge-admin' : 'badge-user'}">
                                ${activity.userRole}
                            </span>
                        </td>
                        <td class="action-type">${activity.action}</td>
                        <td>
                            <span class="details-toggle" onclick="toggleDetails('${detailsId}')">
                                View Details
                            </span>
                        </td>
                        <td>${activity.ip}</td>
                    </tr>
                    <tr class="details-row" id="${detailsId}">
                        <td colspan="5">
                            <div class="details-content">${JSON.stringify(activity.details, null, 2)}</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function toggleDetails(id) {
            const row = document.getElementById(id);
            row.classList.toggle('show');
        }

        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function formatTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);

            if (seconds < 60) return `${seconds}s ago`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        function clearFilters() {
            document.getElementById('userFilter').value = '';
            document.getElementById('actionFilter').value = '';
            loadActivityLog();
        }

        // Load initial data
        loadStats();
        loadActivityLog();

        // Refresh every 10 seconds
        setInterval(() => {
            loadStats();
            loadActivityLog();
        }, 10000);
    </script>
    <script src="admin-mobile-nav.js"></script>
</body>
</html>
