<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Blobby Inbox</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #667085;
      --line: #dfe5ee;
      --soft: #f8fafc;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f8fb;
      color: var(--ink);
    }
    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 18px 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); letter-spacing: -0.04em; }
    a, button { font: inherit; }
    .actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      cursor: pointer;
    }
    .btn.primary { background: var(--ink); color: white; border-color: var(--ink); }
    main { max-width: 1180px; margin: 0 auto; padding: 0 18px 42px; }
    .status { color: var(--muted); font-weight: 700; margin: 0 0 16px; }
    .grid { display: grid; gap: 14px; }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.06);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 18px;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }
    .field {
      background: var(--soft);
      border: 1px solid #edf1f6;
      border-radius: 12px;
      padding: 10px;
      min-width: 0;
    }
    .label {
      display: block;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .value { font-weight: 800; overflow-wrap: anywhere; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #fbfdff;
      border: 1px solid #edf1f6;
      border-radius: 12px;
      padding: 12px;
      color: #344054;
      max-height: 260px;
      overflow: auto;
    }
    img {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #0b1220;
    }
    .empty {
      background: white;
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 30px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }
    @media (max-width: 820px) {
      header, .actions { align-items: flex-start; flex-direction: column; }
      .card { grid-template-columns: 1fr; }
      .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Blobby Inbox</h1>
      <p class="status">Customer Water Blob designs submitted from Blobby.</p>
    </div>
    <div class="actions">
      <a class="btn" href="/employee/employee-portal.html">Employee Portal</a>
      <button class="btn primary" onclick="loadInbox()">Refresh</button>
    </div>
  </header>
  <main>
    <p id="status" class="status">Loading...</p>
    <div id="list" class="grid"></div>
  </main>
  <script>
    const list = document.getElementById('list');
    const statusEl = document.getElementById('status');

    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function parseCustomization(raw) {
      if (!raw) return {};
      try { return JSON.parse(raw); } catch { return {}; }
    }

    async function loadInbox() {
      const token = localStorage.getItem('employeeToken') || localStorage.getItem('authToken') || '';
      if (!token) {
        statusEl.textContent = 'Log into the employee portal first, then come back here.';
        list.innerHTML = '<div class="empty">No employee token found.</div>';
        return;
      }
      statusEl.textContent = 'Loading...';
      try {
        const res = await fetch('/api/product-inquiry', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load inbox');
        const rows = data.inquiries || [];
        statusEl.textContent = `${rows.length} Blobby design${rows.length === 1 ? '' : 's'} found.`;
        if (!rows.length) {
          list.innerHTML = '<div class="empty">No Blobby submissions yet.</div>';
          return;
        }
        list.innerHTML = rows.map((row) => {
          const c = parseCustomization(row.customization);
          const created = row.created_at ? new Date(row.created_at).toLocaleString() : '';
          return `
            <article class="card">
              <div>
                <h2>${esc(row.name)} <span style="color:#667085;font-size:15px;">${esc(created)}</span></h2>
                <div class="meta">
                  <div class="field"><span class="label">Email</span><span class="value">${esc(row.email)}</span></div>
                  <div class="field"><span class="label">Phone</span><span class="value">${esc(row.phone)}</span></div>
                  <div class="field"><span class="label">Size</span><span class="value">${esc(row.product_size || c.size || 'Pending')}</span></div>
                  <div class="field"><span class="label">Quantity</span><span class="value">${esc(row.quantity || 1)}</span></div>
                  <div class="field"><span class="label">Body</span><span class="value">${esc(c.baseColor)}</span></div>
                  <div class="field"><span class="label">Stripes</span><span class="value">${esc(c.stripeStyle)} ${esc(c.stripeColor)}</span></div>
                  <div class="field"><span class="label">End caps</span><span class="value">${esc(c.endCapColor)}</span></div>
                  <div class="field"><span class="label">Anchor patches</span><span class="value">${esc(c.anchorColor)}</span></div>
                </div>
                <pre>${esc(row.message)}</pre>
                <div class="actions">
                  <a class="btn" href="mailto:${esc(row.email)}">Email Customer</a>
                  <a class="btn" href="tel:${esc(row.phone)}">Call</a>
                </div>
              </div>
              <div>${row.custom_image ? `<img src="${row.custom_image}" alt="3D preview">` : '<div class="empty">No preview</div>'}</div>
            </article>
          `;
        }).join('');
      } catch (error) {
        statusEl.textContent = error.message || 'Failed to load inbox';
        list.innerHTML = '<div class="empty">Could not load Blobby submissions.</div>';
      }
    }

    loadInbox();
  </script>
</body>
</html>
